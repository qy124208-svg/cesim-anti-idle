<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 300px;
      font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif;
      margin: 0;
      padding: 14px;
      color: #1f2933;
    }
    h1 { font-size: 15px; margin: 0 0 12px; }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    label.title { font-size: 13px; }
    .switch { position: relative; width: 46px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      inset: 0;
      background: #c62828;
      border-radius: 24px;
      cursor: pointer;
      transition: 0.2s;
    }
    .slider::before {
      content: "";
      position: absolute;
      height: 18px;
      width: 18px;
      left: 3px;
      top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: 0.2s;
    }
    .switch input:checked + .slider { background: #2e7d32; }
    .switch input:checked + .slider::before { transform: translateX(22px); }
    select {
      padding: 3px 6px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 12px;
    }
    .status {
      font-size: 12px;
      color: #666;
      background: #f5f7fa;
      border-radius: 6px;
      padding: 8px;
      margin-top: 4px;
    }
    .hint {
      font-size: 11px;
      color: #999;
      line-height: 1.5;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <h1>Cesim 防挂机助手</h1>

  <div class="row">
    <label class="title">自动滚动（总开关）</label>
    <label class="switch">
      <input type="checkbox" id="enabled" />
      <span class="slider"></span>
    </label>
  </div>

  <div class="row">
    <label class="title">滚动频率</label>
    <select id="freq">
      <option value="slow">慢（30~60 秒）</option>
      <option value="normal" selected>中（15~45 秒）</option>
      <option value="fast">快（8~20 秒）</option>
    </select>
  </div>

  <div class="row">
    <label class="title">滚动幅度</label>
    <select id="scroll">
      <option value="small">小（80~350px）</option>
      <option value="medium">中（150~700px）</option>
      <option value="large" selected>大（300~1200px）</option>
    </select>
  </div>

  <div class="row">
    <label class="title">后台保活（防节流）</label>
    <label class="switch">
      <input type="checkbox" id="keepAlive" checked />
      <span class="slider"></span>
    </label>
  </div>

  <div class="row">
    <label class="title">模拟鼠标移动</label>
    <label class="switch">
      <input type="checkbox" id="mouseMove" checked />
      <span class="slider"></span>
    </label>
  </div>

  <div class="row">
    <label class="title">自动点击</label>
    <label class="switch">
      <input type="checkbox" id="clickEnabled" />
      <span class="slider"></span>
    </label>
  </div>

  <div class="row">
    <label class="title">点击频率</label>
    <select id="clickFreq">
      <option value="slow">慢（5~10 分钟）</option>
      <option value="normal" selected>中（3~6 分钟）</option>
      <option value="fast">快（1~3 分钟）</option>
    </select>
  </div>

  <div class="row">
    <label class="title">心跳请求（防掉线）</label>
    <label class="switch">
      <input type="checkbox" id="heartbeatEnabled" checked />
      <span class="slider"></span>
    </label>
  </div>

  <div class="row">
    <label class="title">心跳频率</label>
    <select id="heartbeatFreq">
      <option value="slow">慢（15~25 分钟）</option>
      <option value="normal" selected>中（8~15 分钟）</option>
      <option value="fast">快（4~8 分钟）</option>
    </select>
  </div>

  <div class="status" id="status">读取中…</div>

  <div class="hint">
    仅在 *.cesim.cn 页面生效。点击与鼠标移动均为「程序化 / 合成事件」，不移动真实光标，不影响你在其他窗口正常用鼠标。心跳请求会带上登录凭证重新请求当前页，用于维持服务器 session（这才是防掉线的关键）。
  </div>

  <script src="popup.js"></script>
</body>
</html>
